<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DC COMICS</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #0f0f0f;
      color: white;
    }

    header {
      background: linear-gradient(90deg, #ff0000, #ff7300);
      padding: 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 2.5rem;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
    }

    nav {
      background: #1a1a1a;
      display: flex;
      justify-content: center;
      gap: 30px;
      padding: 15px;
      border-bottom: 2px solid #ff7300;
      flex-wrap: wrap;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-weight: bold;
      font-size: 1.1rem;
      transition: 0.3s;
    }

    nav a:hover {
      color: #ff7300;
      transform: scale(1.1);
    }

    main {
      padding: 40px 20px;
      text-align: center;
      max-width: 1200px;
      margin: 0 auto;
    }

    main h2 {
      font-size: 2rem;
      margin-bottom: 15px;
      color: #ff7300;
    }

    main p {
      font-size: 1.2rem;
      line-height: 1.6;
      color: #ccc;
    }

    .galeria {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      margin-top: 40px;
    }

    .card {
      background: #1a1a1a;
      border-radius: 8px;
      padding: 0;
      border: 1px solid #333;5
      overflow: hidden;
      transition: 0.3s;
    }
   
    .card:hover {
      transform: translateY(-5px);
      border-color: #78d4e0;
      box-shadow: 0 5px 15px rgba(255, 115, 0, 0.3);
    }

    .card img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      display: block;
    }
   
    .card-content {
      padding: 20px;
    }
   
    .card h3 {
      color: #e1a9e9;
      margin-bottom: 10px;
      font-size: 1.4rem;
    }

    footer {
      background: #1a1a1a;
      text-align: center;
      padding: 20px;
      margin-top: 60px;
      border-top: 2px solid #ff7300;
    }
   
    @media (max-width: 600px) {
      header h1 { font-size: 1.8rem; }
      nav { gap: 15px; }
    }
  </style>
</head>
<body>

  <header>
    <h1>Como surgiu a DC COMICS</h1>
  </header>

  <nav>
    <a href="#home">Home</a>
    <a href="#fotos">Fotos</a>
    <a href="#videos">Vídeos</a>
    <a href="#contato">Contato</a>
  </nav>

  <main>
    <h2>Bem-vindo ao mundo dos BRUTOS</h2>
    <p>Aqui você encontra as melhores </p>
   
    <div class="galeria">
      <div class="card">
        <img src=https://bleedingcool.com/comics/dc-comics-selling-almost-half-as-many-comics-a-month-as-it-used-to/ alt="DC
        <div class="card-content">
          <h3>Scania Arqueada</h3>
          <p>Os brutos mais insanos da estrada</p>
        </div>
      </div>
      <div class="card">
        <img src=https://ovicio.com.br/trindade-dc-comics-anuncia-cancelamento-da-hq/
        <div class="card-content">
          <h3>Volvo FH Arqueado</h3>
          <p>Potência e estilo no grau</p>
        </div>
      </div>
      <div class="card">
        <img src=https://www.pinterest.com/pin/major-malcolm-wheeler-nicholson-dc-comics-founder--595178907023942968/
        <div class="card-content">
          <h3>Eventos</h3>
          <p>Cobertura dos maiores encontros</p>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <p>&copy; PATROCÍN</p>
  </footer>

</body>
</html>
